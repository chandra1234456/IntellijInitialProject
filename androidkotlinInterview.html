<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Android Kotlin Interview Questions</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        :root {
          --bg:       #080C10;
          --bg2:      #0E1419;
          --bg3:      #141C24;
          --border:   #1A2535;
          --cyan:     #00E5FF;
          --green:    #00FFB3;
          --orange:   #FF6B35;
          --purple:   #C084FC;
          --yellow:   #FFD60A;
          --red:      #FF4D6D;
          --txt:      #D6E8FF;
          --muted:    #4A6080;
          --mono:     'Space Mono', monospace;
          --sans:     'Syne', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
          background: var(--bg);
          color: var(--txt);
          font-family: var(--mono);
          min-height: 100vh;
          overflow-x: hidden;
        }

        /* ── GRID BACKGROUND ── */
        body::before {
          content: '';
          position: fixed; inset: 0;
          background-image:
            linear-gradient(var(--border) 1px, transparent 1px),
            linear-gradient(90deg, var(--border) 1px, transparent 1px);
          background-size: 40px 40px;
          opacity: 0.35;
          pointer-events: none;
          z-index: 0;
        }

        /* ── GLOW ORBS ── */
        .orb {
          position: fixed;
          border-radius: 50%;
          filter: blur(120px);
          pointer-events: none;
          z-index: 0;
          opacity: 0.12;
        }
        .orb1 { width: 600px; height: 600px; background: var(--cyan);   top: -200px; left: -200px; }
        .orb2 { width: 500px; height: 500px; background: var(--purple); bottom: -150px; right: -100px; }
        .orb3 { width: 400px; height: 400px; background: var(--green);  top: 40%; left: 50%; }

        /* ── LAYOUT ── */
        .wrapper { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 24px 80px; }

        /* ── HEADER ── */
        header {
          padding: 60px 0 48px;
          border-bottom: 1px solid var(--border);
          margin-bottom: 48px;
        }
        .header-tag {
          font-family: var(--mono);
          font-size: 11px;
          color: var(--cyan);
          letter-spacing: 0.2em;
          text-transform: uppercase;
          margin-bottom: 16px;
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .header-tag::before {
          content: '';
          width: 32px; height: 1px;
          background: var(--cyan);
        }
        h1 {
          font-family: var(--sans);
          font-size: clamp(36px, 5vw, 64px);
          font-weight: 800;
          line-height: 1.05;
          letter-spacing: -0.02em;
          color: #fff;
          margin-bottom: 16px;
        }
        h1 span { color: var(--cyan); }
        .header-sub {
          font-size: 13px;
          color: var(--muted);
          line-height: 1.7;
          max-width: 560px;
        }
        .header-stats {
          display: flex;
          gap: 32px;
          margin-top: 32px;
          flex-wrap: wrap;
        }
        .stat {
          display: flex;
          flex-direction: column;
          gap: 4px;
        }
        .stat-num {
          font-family: var(--sans);
          font-size: 28px;
          font-weight: 800;
          color: #fff;
        }
        .stat-lbl { font-size: 10px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }

        /* ── SEARCH / FILTER ── */
        .controls {
          display: flex;
          gap: 12px;
          margin-bottom: 40px;
          flex-wrap: wrap;
          align-items: center;
        }
        .search-wrap {
          position: relative;
          flex: 1;
          min-width: 220px;
        }
        .search-wrap::before {
          content: '⌕';
          position: absolute;
          left: 14px; top: 50%;
          transform: translateY(-50%);
          color: var(--muted);
          font-size: 18px;
          pointer-events: none;
        }
        #search {
          width: 100%;
          background: var(--bg2);
          border: 1px solid var(--border);
          border-radius: 8px;
          padding: 10px 14px 10px 40px;
          color: var(--txt);
          font-family: var(--mono);
          font-size: 13px;
          outline: none;
          transition: border-color 0.2s;
        }
        #search:focus { border-color: var(--cyan); }
        #search::placeholder { color: var(--muted); }

        .filter-btn {
          background: var(--bg2);
          border: 1px solid var(--border);
          border-radius: 8px;
          padding: 9px 16px;
          color: var(--muted);
          font-family: var(--mono);
          font-size: 11px;
          letter-spacing: 0.08em;
          cursor: pointer;
          transition: all 0.15s;
          white-space: nowrap;
        }
        .filter-btn:hover, .filter-btn.active {
          border-color: currentColor;
          color: var(--txt);
        }
        .filter-btn[data-color="cyan"].active   { color: var(--cyan);   border-color: var(--cyan); }
        .filter-btn[data-color="green"].active  { color: var(--green);  border-color: var(--green); }
        .filter-btn[data-color="orange"].active { color: var(--orange); border-color: var(--orange); }
        .filter-btn[data-color="purple"].active { color: var(--purple); border-color: var(--purple); }
        .filter-btn[data-color="yellow"].active { color: var(--yellow); border-color: var(--yellow); }
        .filter-btn[data-color="red"].active    { color: var(--red);    border-color: var(--red); }

        /* ── TOPIC SECTIONS ── */
        .topic-block { margin-bottom: 48px; }
        .topic-header {
          display: flex;
          align-items: center;
          gap: 14px;
          margin-bottom: 20px;
          padding-bottom: 14px;
          border-bottom: 1px solid var(--border);
          cursor: pointer;
          user-select: none;
        }
        .topic-dot {
          width: 10px; height: 10px;
          border-radius: 50%;
          flex-shrink: 0;
        }
        .topic-title {
          font-family: var(--sans);
          font-size: 18px;
          font-weight: 700;
          color: #fff;
          flex: 1;
        }
        .topic-count {
          font-size: 11px;
          color: var(--muted);
          letter-spacing: 0.08em;
          background: var(--bg3);
          padding: 3px 10px;
          border-radius: 99px;
        }
        .topic-toggle {
          font-size: 14px;
          color: var(--muted);
          transition: transform 0.3s;
        }
        .topic-block.collapsed .topic-toggle { transform: rotate(-90deg); }
        .topic-block.collapsed .questions-grid { display: none; }

        /* ── QUESTIONS GRID ── */
        .questions-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
          gap: 12px;
        }

        /* ── QUESTION CARD ── */
        .q-card {
          background: var(--bg2);
          border: 1px solid var(--border);
          border-radius: 10px;
          padding: 16px 18px;
          position: relative;
          overflow: hidden;
          transition: border-color 0.2s, transform 0.15s;
          cursor: default;
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        .q-card::before {
          content: '';
          position: absolute;
          left: 0; top: 0; bottom: 0;
          width: 3px;
          border-radius: 10px 0 0 10px;
        }
        .q-card:hover { transform: translateY(-2px); }

        .q-card[data-diff="easy"]   { border-color: #1A2535; }
        .q-card[data-diff="easy"]:hover   { border-color: var(--green); }
        .q-card[data-diff="easy"]::before   { background: var(--green); }

        .q-card[data-diff="medium"] { border-color: #1A2535; }
        .q-card[data-diff="medium"]:hover { border-color: var(--yellow); }
        .q-card[data-diff="medium"]::before { background: var(--yellow); }

        .q-card[data-diff="hard"]   { border-color: #1A2535; }
        .q-card[data-diff="hard"]:hover   { border-color: var(--red); }
        .q-card[data-diff="hard"]::before   { background: var(--red); }

        .q-card[data-diff="god"]    { border-color: #1A2535; }
        .q-card[data-diff="god"]:hover    { border-color: var(--purple); }
        .q-card[data-diff="god"]::before    { background: var(--purple); }

        .q-meta {
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .q-num {
          font-size: 10px;
          color: var(--muted);
          letter-spacing: 0.06em;
        }
        .q-badge {
          font-size: 9px;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          padding: 2px 8px;
          border-radius: 4px;
        }
        .badge-easy   { background: #00FFB315; color: var(--green);  border: 1px solid #00FFB330; }
        .badge-medium { background: #FFD60A15; color: var(--yellow); border: 1px solid #FFD60A30; }
        .badge-hard   { background: #FF4D6D15; color: var(--red);    border: 1px solid #FF4D6D30; }
        .badge-god    { background: #C084FC15; color: var(--purple); border: 1px solid #C084FC30; }

        .q-text {
          font-size: 13px;
          line-height: 1.65;
          color: var(--txt);
          flex: 1;
        }
        .q-text code {
          background: var(--bg3);
          border: 1px solid var(--border);
          border-radius: 4px;
          padding: 1px 6px;
          font-size: 11px;
          color: var(--cyan);
          font-family: var(--mono);
        }
        .q-solved {
          display: flex;
          align-items: center;
          gap: 6px;
          font-size: 10px;
          color: var(--muted);
          cursor: pointer;
          width: fit-content;
          transition: color 0.15s;
          margin-top: 4px;
          user-select: none;
        }
        .q-solved:hover { color: var(--green); }
        .q-solved input { display: none; }
        .check-box {
          width: 14px; height: 14px;
          border: 1px solid var(--border);
          border-radius: 3px;
          display: flex; align-items: center; justify-content: center;
          font-size: 9px;
          transition: all 0.15s;
        }
        .q-solved.done .check-box {
          background: var(--green);
          border-color: var(--green);
          color: #000;
        }
        .q-solved.done { color: var(--green); }

        /* ── PROGRESS BAR ── */
        .progress-bar-wrap {
          background: var(--bg2);
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 20px 24px;
          margin-bottom: 40px;
          display: flex;
          align-items: center;
          gap: 20px;
          flex-wrap: wrap;
        }
        .progress-label { font-size: 12px; color: var(--muted); white-space: nowrap; }
        .progress-track {
          flex: 1;
          min-width: 160px;
          height: 6px;
          background: var(--bg3);
          border-radius: 99px;
          overflow: hidden;
        }
        .progress-fill {
          height: 100%;
          width: 0%;
          background: linear-gradient(90deg, var(--cyan), var(--green));
          border-radius: 99px;
          transition: width 0.5s ease;
        }
        .progress-num { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; }

        /* ── EMPTY STATE ── */
        #empty {
          display: none;
          text-align: center;
          padding: 64px 0;
          color: var(--muted);
          font-size: 14px;
        }

        /* ── SCROLL TOP ── */
        #scrollTop {
          position: fixed;
          bottom: 28px; right: 28px;
          width: 40px; height: 40px;
          background: var(--bg2);
          border: 1px solid var(--border);
          border-radius: 8px;
          display: flex; align-items: center; justify-content: center;
          cursor: pointer;
          font-size: 16px;
          color: var(--muted);
          z-index: 100;
          transition: all 0.2s;
          opacity: 0;
          pointer-events: none;
        }
        #scrollTop.visible { opacity: 1; pointer-events: auto; }
        #scrollTop:hover { border-color: var(--cyan); color: var(--cyan); }

        /* ── ANIMATIONS ── */
        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(16px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        .topic-block { animation: fadeUp 0.4s ease both; }
        .topic-block:nth-child(2) { animation-delay: 0.05s; }
        .topic-block:nth-child(3) { animation-delay: 0.10s; }
        .topic-block:nth-child(4) { animation-delay: 0.15s; }
        .topic-block:nth-child(5) { animation-delay: 0.20s; }
        .topic-block:nth-child(6) { animation-delay: 0.25s; }
        .topic-block:nth-child(7) { animation-delay: 0.30s; }
        .topic-block:nth-child(8) { animation-delay: 0.35s; }
        .topic-block:nth-child(9) { animation-delay: 0.40s; }

        @media (max-width: 600px) {
          .questions-grid { grid-template-columns: 1fr; }
          h1 { font-size: 32px; }
        }
    </style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</div>

<div class="wrapper">

    <!-- HEADER -->
    <header>
        <div class="header-tag">Android · Kotlin · Interview Prep</div>
        <h1>Interview <span>Questions</span><br/>Collection</h1>
        <p class="header-sub">Problems only — solve them yourself. All major topics covered from basics to god-level. Track your progress as you go.</p>
        <div class="header-stats">
            <div class="stat"><span class="stat-num" id="totalCount">0</span><span class="stat-lbl">Total Questions</span></div>
            <div class="stat"><span class="stat-num" id="solvedCount">0</span><span class="stat-lbl">Solved</span></div>
            <div class="stat"><span class="stat-num" id="topicsCount">0</span><span class="stat-lbl">Topics</span></div>
        </div>
    </header>

    <!-- PROGRESS -->
    <div class="progress-bar-wrap">
        <span class="progress-label">Your progress</span>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <span class="progress-num" id="progressNum">0 / 0</span>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <div class="search-wrap">
            <input type="text" id="search" placeholder="Search questions..." oninput="filterAll()"/>
        </div>
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">All</button>
        <button class="filter-btn" data-filter="easy"   data-color="green"  onclick="setFilter('easy',this)">Easy</button>
        <button class="filter-btn" data-filter="medium" data-color="yellow" onclick="setFilter('medium',this)">Medium</button>
        <button class="filter-btn" data-filter="hard"   data-color="red"    onclick="setFilter('hard',this)">Hard</button>
        <button class="filter-btn" data-filter="god"    data-color="purple" onclick="setFilter('god',this)">⚡ God Level</button>
    </div>

    <!-- QUESTIONS CONTAINER -->
    <div id="container"></div>
    <div id="empty">No questions match your search.</div>

</div>

<script>
    // ─────────────────────────────────────────────────────────────
    //  DATA
    // ─────────────────────────────────────────────────────────────
    const topics = [
      {
        id: "kotlin-basics",
        title: "Kotlin Basics",
        color: "#00E5FF",
        questions: [
          { d:"easy",   t:"What is the difference between <code>val</code> and <code>var</code> in Kotlin?" },
          { d:"easy",   t:"What are Kotlin's basic data types and how do they differ from Java primitives?" },
          { d:"easy",   t:"Explain <code>null safety</code> in Kotlin. What is the difference between <code>?</code> and <code>!!</code>?" },
          { d:"easy",   t:"What is a <code>data class</code> in Kotlin? What does it auto-generate?" },
          { d:"easy",   t:"What is the difference between <code>==</code> and <code>===</code> in Kotlin?" },
          { d:"easy",   t:"Explain <code>when</code> expression in Kotlin. How is it different from Java's switch?" },
          { d:"easy",   t:"What are <code>companion objects</code> and how do they differ from Java static members?" },
          { d:"medium",  t:"What is the difference between <code>object</code>, <code>companion object</code>, and <code>class</code>?" },
          { d:"medium",  t:"Explain <code>sealed class</code> vs <code>enum class</code>. When would you use each?" },
          { d:"medium",  t:"What are <code>extension functions</code>? Give a practical example." },
          { d:"medium",  t:"How does Kotlin handle <code>operator overloading</code>? Give an example with <code>plus</code>." },
          { d:"medium",  t:"What is the difference between <code>lateinit var</code> and <code>by lazy</code>?" },
          { d:"medium",  t:"Explain <code>inline</code>, <code>noinline</code>, and <code>crossinline</code> function modifiers." },
          { d:"hard",   t:"How does Kotlin achieve null-safety at the bytecode level? What does the compiler generate?" },
          { d:"hard",   t:"What are <code>reified</code> type parameters? Why do they require <code>inline</code>?" },
          { d:"god",    t:"Explain how Kotlin's <code>delegation</code> works internally. How does <code>by</code> keyword get compiled?" },
        ]
      },
      {
        id: "collections",
        title: "Collections & Functional",
        color: "#00FFB3",
        questions: [
          { d:"easy",   t:"What is the difference between <code>List</code> and <code>MutableList</code> in Kotlin?" },
          { d:"easy",   t:"Explain <code>map</code>, <code>filter</code>, and <code>reduce</code> with examples." },
          { d:"easy",   t:"What does <code>flatMap</code> do? How is it different from <code>map</code>?" },
          { d:"easy",   t:"What is the difference between <code>forEach</code> and <code>for</code> loop in Kotlin?" },
          { d:"medium",  t:"Explain <code>Sequence</code> vs <code>Collection</code>. When is Sequence more efficient?" },
          { d:"medium",  t:"What is the difference between <code>groupBy</code> and <code>partition</code>?" },
          { d:"medium",  t:"How does <code>fold</code> differ from <code>reduce</code>? When would you use fold?" },
          { d:"medium",  t:"Explain <code>associateBy</code>, <code>associateWith</code>, and <code>associate</code>." },
          { d:"medium",  t:"What is the difference between <code>any</code>, <code>all</code>, and <code>none</code>?" },
          { d:"hard",   t:"How does Kotlin implement <code>Sequence</code> laziness under the hood? What is the iterator chain?" },
          { d:"hard",   t:"What is <code>zip</code> and <code>zipWithNext</code>? Implement a sliding window using them." },
          { d:"hard",   t:"Explain <code>chunked</code> vs <code>windowed</code>. Implement a batch-processing pipeline." },
          { d:"god",    t:"Implement a custom <code>collect</code> operator for Kotlin Sequences that short-circuits on a condition — similar to Java Stream's <code>takeWhile</code> before it was added." },
        ]
      },
      {
        id: "coroutines",
        title: "Kotlin Coroutines",
        color: "#FF6B35",
        questions: [
          { d:"easy",   t:"What is a coroutine? How is it different from a Thread?" },
          { d:"easy",   t:"What are <code>suspend</code> functions? Can you call them from anywhere?" },
          { d:"easy",   t:"What is <code>CoroutineScope</code> and why is it important?" },
          { d:"easy",   t:"Explain the difference between <code>launch</code> and <code>async</code>." },
          { d:"easy",   t:"What is <code>Dispatchers.IO</code>, <code>Dispatchers.Main</code>, and <code>Dispatchers.Default</code>?" },
          { d:"medium",  t:"What is structured concurrency? Why does it matter?" },
          { d:"medium",  t:"Explain <code>Job</code>, <code>SupervisorJob</code>. How does cancellation propagate?" },
          { d:"medium",  t:"What is the difference between <code>coroutineScope</code> and <code>supervisorScope</code>?" },
          { d:"medium",  t:"How does <code>withContext</code> differ from <code>async</code> + <code>await</code>?" },
          { d:"medium",  t:"What is <code>viewModelScope</code> and <code>lifecycleScope</code>? When is each cancelled?" },
          { d:"medium",  t:"How do you handle exceptions in coroutines? <code>try-catch</code> vs <code>CoroutineExceptionHandler</code>." },
          { d:"hard",   t:"Explain the coroutine state machine. How does the Kotlin compiler transform <code>suspend</code> functions?" },
          { d:"hard",   t:"What is <code>CancellationException</code>? Why should you never catch it silently?" },
          { d:"hard",   t:"What is a <code>Continuation</code>? How does it relate to callbacks?" },
          { d:"hard",   t:"Explain <code>callbackFlow</code> and <code>suspendCancellableCoroutine</code>. When would you use each?" },
          { d:"hard",   t:"What is <code>Mutex</code> vs <code>Semaphore</code> in coroutines? Implement a rate-limiter using Semaphore." },
          { d:"god",    t:"How would you implement a custom coroutine <code>CoroutineDispatcher</code> backed by a thread pool? What interfaces must you implement?" },
          { d:"god",    t:"Explain how coroutine continuation-passing style (CPS) transformation works at bytecode level. What does a suspend function's <code>invokeSuspend</code> look like?" },
        ]
      },
      {
        id: "flow",
        title: "Kotlin Flow",
        color: "#C084FC",
        questions: [
          { d:"easy",   t:"What is <code>Flow</code> in Kotlin? How is it different from <code>LiveData</code>?" },
          { d:"easy",   t:"What is the difference between <code>cold</code> and <code>hot</code> flows?" },
          { d:"easy",   t:"What is <code>StateFlow</code>? How does it compare to <code>MutableLiveData</code>?" },
          { d:"easy",   t:"What is <code>SharedFlow</code>? What are <code>replay</code> and <code>extraBufferCapacity</code>?" },
          { d:"medium",  t:"Explain <code>flowOn</code>. How is it different from <code>withContext</code>?" },
          { d:"medium",  t:"What are <code>conflate</code> and <code>collectLatest</code>? When would you use them?" },
          { d:"medium",  t:"Explain <code>combine</code> vs <code>zip</code> in Flow. What happens when one emits faster?" },
          { d:"medium",  t:"What is <code>flatMapLatest</code>? How does it help with search-as-you-type scenarios?" },
          { d:"medium",  t:"How do you convert a <code>Flow</code> to <code>StateFlow</code> in a ViewModel?" },
          { d:"hard",   t:"Explain Flow's <code>backpressure</code> handling. What is <code>buffer</code> operator and channel capacity?" },
          { d:"hard",   t:"What is the difference between <code>shareIn</code> and <code>stateIn</code>? Explain <code>SharingStarted</code> strategies." },
          { d:"hard",   t:"How would you implement a debounce operator for Flow without using the built-in one?" },
          { d:"god",    t:"Explain the internal implementation of <code>StateFlow</code>. How does it achieve atomic state updates and distinct-until-changed semantics?" },
          { d:"god",    t:"How does <code>channelFlow</code> differ from <code>flow { }</code> builder? When does each suspend and why?" },
        ]
      },
      {
        id: "architecture",
        title: "Android Architecture",
        color: "#FFD60A",
        questions: [
          { d:"easy",   t:"What is MVVM? What are the responsibilities of each layer?" },

    // ─────────────────────────────────────────────────────────────
    //  STATE
    // ─────────────────────────────────────────────────────────────
    let currentFilter = 'all';
    let solved = JSON.parse(localStorage.getItem('aq_solved') || '{}');

    // ─────────────────────────────────────────────────────────────
    //  RENDER
    // ─────────────────────────────────────────────────────────────
    function render() {
      const container = document.getElementById('container');
      const search    = document.getElementById('search').value.toLowerCase();
      container.innerHTML = '';

      let totalQ = 0, visibleQ = 0;

      topics.forEach(topic => {
        const filtered = topic.questions.filter(q => {
          const matchDiff   = currentFilter === 'all' || q.d === currentFilter;
          const matchSearch = q.t.toLowerCase().replace(/<[^>]+>/g,'').includes(search);
          return matchDiff && matchSearch;
        });

        totalQ += topic.questions.length;
        if (!filtered.length) return;
        visibleQ += filtered.length;

        const block = document.createElement('div');
        block.className = 'topic-block';
        block.dataset.topicId = topic.id;

        block.innerHTML = `
          <div class="topic-header" onclick="toggleTopic(this)">
            <div class="topic-dot" style="background:${topic.color}; box-shadow:0 0 8px ${topic.color}60;"></div>
            <span class="topic-title">${topic.title}</span>
            <span class="topic-count">${filtered.length} questions</span>
            <span class="topic-toggle">▾</span>
          </div>
          <div class="questions-grid">
            ${filtered.map((q, i) => {
              const qid = `${topic.id}-${topic.questions.indexOf(q)}`;
              const isSolved = !!solved[qid];
              return `
              <div class="q-card" data-diff="${q.d}" data-qid="${qid}">
                <div class="q-meta">
                  <span class="q-num">Q${i+1}</span>
                  <span class="q-badge badge-${q.d}">${q.d === 'god' ? '⚡ GOD' : q.d.toUpperCase()}</span>
                </div>
                <div class="q-text">${q.t}</div>
                <label class="q-solved ${isSolved ? 'done' : ''}" onclick="toggleSolved('${qid}', this)">
                  <span class="check-box">${isSolved ? '✓' : ''}</span>
                  ${isSolved ? 'Solved' : 'Mark as solved'}
                </label>
              </div>`;
            }).join('')}
          </div>
        `;

        container.appendChild(block);
      });

      document.getElementById('empty').style.display = visibleQ === 0 ? 'block' : 'none';
      updateStats(totalQ);
    }

    function updateStats(total) {
      const solvedKeys = Object.keys(solved).filter(k => solved[k]);
      const solvedN    = solvedKeys.length;

      // count all questions
      let allQ = 0;
      topics.forEach(t => allQ += t.questions.length);

      document.getElementById('totalCount').textContent = allQ;
      document.getElementById('solvedCount').textContent = solvedN;
      document.getElementById('topicsCount').textContent = topics.length;
      document.getElementById('progressNum').textContent = `${solvedN} / ${allQ}`;
      document.getElementById('progressFill').style.width = allQ ? `${(solvedN/allQ*100).toFixed(1)}%` : '0%';
    }

    // ─────────────────────────────────────────────────────────────
    //  INTERACTIONS
    // ─────────────────────────────────────────────────────────────
    function toggleSolved(qid, label) {
      event.stopPropagation();
      solved[qid] = !solved[qid];
      localStorage.setItem('aq_solved', JSON.stringify(solved));
      label.classList.toggle('done', !!solved[qid]);
      label.querySelector('.check-box').textContent = solved[qid] ? '✓' : '';
      label.lastChild.textContent = solved[qid] ? ' Solved' : ' Mark as solved';
      updateStats();
    }

    function toggleTopic(header) {
      header.parentElement.classList.toggle('collapsed');
    }

    function setFilter(f, btn) {
      currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function filterAll() { render(); }

    // scroll top
    window.addEventListener('scroll', () => {
      document.getElementById('scrollTop').classList.toggle('visible', window.scrollY > 300);
    });

    // ─────────────────────────────────────────────────────────────
    //  INIT
    // ─────────────────────────────────────────────────────────────
    render();
</script>
